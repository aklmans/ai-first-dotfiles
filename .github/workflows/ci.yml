name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ripgrep
        # The smoke tests hard-fail without rg rather than passing vacuously.
        # Nothing else is installed here: the install scripts are exercised
        # against stubs, so CI never runs a real `brew install` of the 73
        # packages in bootstrap/brew.sh.
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep

      - name: Report toolchain
        run: |
          /bin/bash --version | head -n 1
          rg --version | head -n 1
          python3 --version
          sw_vers

      - name: Run smoke tests
        # tests/run-all.sh rather than a loop over tests/smoke/*.sh: a runner
        # here has no profile installed, so a suite that reads $HOME instead of
        # its own fixtures passes on this machine and fails on one where this
        # repository is actually deployed. The runner covers both, and the AI
        # router tests come with it.
        run: bash tests/run-all.sh
