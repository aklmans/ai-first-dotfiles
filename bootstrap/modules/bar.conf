# The bar has no preference override of its own.
#
# It used to repeat base.conf's three bar item lists verbatim. That was harmless
# only while module overlays were written into a directory nothing read: once
# they load, this file would overwrite the bar composition of whatever profile
# it lands next to - deleting an author-full bar's ai_notifications item just
# because `bar` was named again on a later run.
#
# Module-only composition still gets those lists, from 00-base.conf.
