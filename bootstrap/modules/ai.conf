# If Hammerspoon is also selected, expose AI hotkeys.
#
# The terminal is deliberately not set here. base.conf already picks Terminal
# for module-only composition, and repeating it would overwrite a terminal the
# user or the advisor had chosen, every time `ai` appeared in a later run.
# Choosing a terminal is what the terminal and warp modules are for.
AI_FIRST_FEATURE_AI_HOTKEYS="1"
