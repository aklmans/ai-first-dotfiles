# Optional low-intervention routes.
#
# Everything below used to live in `case` blocks inside should_float_window, so
# it applied on every install regardless of the routing pack - including `none`,
# which the docs describe as no shipped app placement. These are widely used
# apps rather than anyone's private inventory, which is why they land here and
# not in author.conf: opting in to this pack is how you ask for them.
#
# `prefer` places a window on the first open of that app and does not keep
# dragging it back, which is what makes this pack low-intervention.
#
# match|value|target-role|policy|layout
