# The author's own toolbox. These used to be a `case` block inside
# should_float_window, which meant every install got them whatever routing pack
# it had selected - including `none`, which promises no shipped app placement.
#
# `current|follow|<layout>` is how this format expresses "decide the shape of
# the window, say nothing about where it goes". A `-` target parses as the
# `inherit` policy, but emit_routes_file_as_toml renders no rule at all for an
# inherit row coming from a pack, so the AeroSpace side would silently lose it.
