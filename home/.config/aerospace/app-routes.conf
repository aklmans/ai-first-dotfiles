# Optional exact-match overrides, evaluated before the shipped app rules.
#
# Format: match|value|target|policy|layout
#   match      id or name
#   target     a semantic role, configured workspace, or current
#   policy     follow, prefer, or fixed
#   layout     tiling, floating, or - to keep the current layout
#
# Examples:
# id|com.microsoft.VSCode|focus|prefer|tiling
# name|Safari|current|follow|tiling
# id|com.example.Utility|utility|fixed|floating
#
# Legacy four-column records remain supported.
#
# Context tools belong where they are invoked, not on a global utility desk.
id|com.apple.finder|current|follow|floating
id|com.apple.Preview|current|follow|floating

# Invalid records are ignored. The installer preserves local edits unless
# DOTFILES_FORCE=1 is used. Use app-route.sh for quick, backed-up changes.
