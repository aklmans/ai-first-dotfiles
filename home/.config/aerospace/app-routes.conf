# Optional exact-match overrides, evaluated before the shipped app rules.
#
# Format: match|value|workspace|layout
#   match      id or name
#   workspace  a configured workspace number, or - to keep the current one
#   layout     tiling, floating, or - to keep the current layout
#
# Examples:
# id|com.microsoft.VSCode|3|tiling
# name|Safari|6|tiling
