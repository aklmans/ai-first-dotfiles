# Which physical monitor plays which role.
#
# This file and workspaces.conf are the only two places this setup writes down
# anything about your desk. Every script under ~/.config/aerospace/, the
# SketchyBar workspace items and the generated blocks of ~/.aerospace.toml read
# them from here.
#
# You do not have to edit this file. An empty role is resolved from whatever is
# actually connected, so a Mac with one display - a laptop on its own - works
# out of the box: main, side and stage all resolve to that one display, every
# workspace lands on it, and nothing waits at login for a monitor that is not
# there.
#
# Fill a role in when you want a specific display pinned to it, for example so
# workspace 7 always opens on the panel to your right and not on whichever
# monitor macOS enumerated second today. Names must match exactly; list the
# ones this machine can see with:
#
#     aerospace list-monitors
#
# How a role is resolved, in order:
#
#   1. the monitor named below, when it is connected
#   2. otherwise the next connected monitor no other role has claimed
#   3. otherwise the role above it - stage falls back to side, side to main -
#      so one display can carry all three roles
#
# Values set in the environment win over this file, which is what
# `AEROSPACE_MAIN_MONITOR_NAME="Studio Display" ~/.config/aerospace/doctor.sh`
# relies on.
#
# Format, and it is data rather than a shell script: one assignment per line,
# one of the three keys below, and a value in double quotes, single quotes or
# no quotes at all. Leading spaces and spaces around the `=` are fine, and so
# is a trailing `# comment`. Nothing in a value is expanded - a display
# genuinely called `$(x)` is that display's name, not a command - which is why
# this file is safe to hand-edit even though it is read at every login.
#
#     AEROSPACE_MAIN_MONITOR_NAME="PHL 279C9"
#
# This file used to be executed instead of read, and a file that still needs to
# be - one with a loop or an `export` in it - is still executed, with one
# warning naming it. Keep to the shape above and you never see that warning.
#
# After editing, run:
#
#     ~/.config/aerospace/render-layout.sh
#
# The scripts here read this file directly, but AeroSpace reads TOML, so the
# names also have to be written into ~/.aerospace.toml for AeroSpace itself to
# pin workspaces to displays. render-layout.sh does that; doctor.sh reports it
# when the two have drifted apart. Redeploying does it for you.

# The display you work on. Workspaces in AEROSPACE_MAIN_WORKSPACES live here.
# Example, the author's desk: "PHL 279C9"
AEROSPACE_MAIN_MONITOR_NAME=""

# The secondary panel. Workspaces in AEROSPACE_SIDE_WORKSPACES live here.
# Example, the author's desk: "24V5C2"
AEROSPACE_SIDE_MONITOR_NAME=""

# The recording / meeting / presentation screen. Workspaces in
# AEROSPACE_STAGE_WORKSPACES live here, and Hammerspoon's Recording Mode moves
# the focused window to the first of them.
# Example, the author's desk: "Built-in Retina Display"
AEROSPACE_STAGE_MONITOR_NAME=""
