# How many workspaces exist, and which display role each one belongs to.
#
# This is the only file that decides the number of workspaces. AeroSpace's
# persistent workspace list, its workspace-to-monitor assignment, the Ctrl+N
# and Ctrl+Shift+N shortcuts, the SketchyBar workspace items, the arrow-key
# workspace cycling, the display layout check and Hammerspoon's recording
# workspace are all derived from the three lines at the bottom.
#
# To run five workspaces instead of thirteen, edit the lists and run:
#
#     ~/.config/aerospace/render-layout.sh
#
# That regenerates the marked blocks of ~/.aerospace.toml in place. Everything
# else picks the change up on its next run: reload SketchyBar and AeroSpace
# (Ctrl+Alt+R) to see it immediately.
#
# Notes:
#
#   - Workspace names are what AeroSpace calls them. Numbers are the usual
#     choice because they read well on the bar and map onto number keys, but
#     any name AeroSpace accepts works.
#   - Single-chord shortcuts are handed out in order: 1-9, then 0, [, ] and \.
#     Workspaces past the fourteenth keep working, they just have no one-key
#     shortcut; move to them with Ctrl+Left / Ctrl+Right or `aerospace
#     workspace <name>`.
#   - A role may be empty. Emptying AEROSPACE_STAGE_WORKSPACES removes the
#     recording stage; Recording Mode then uses the last side workspace.
#   - App placement rules in app-defaults.sh are written against the thirteen
#     workspaces below. Shrink the set and a rule that asks for workspace 13 is
#     mapped onto the highest workspace that still exists rather than creating
#     a new one.

# Daily work. Lives on the main display.
AEROSPACE_MAIN_WORKSPACES="1 2 3 4 5 6"

# Secondary work. Lives on the side display.
AEROSPACE_SIDE_WORKSPACES="7 8 9 10 11 12"

# Recording / meeting / presentation stage. Lives on the stage display.
AEROSPACE_STAGE_WORKSPACES="13"
