# Readable on a broadcast, not on your desk.
#
# Select it with `~/.config/sketchybar/theme-control.sh stream`.
#
# What this is solving. A 1080p stream of a 1920x1080 logical desktop is 1:1, so
# viewers see the bar at exactly its real size - and then a phone shows that
# frame about 400px wide. A 13pt label lands somewhere near five pixels there,
# and H.264 spends its bits on the window you are demonstrating rather than on
# thin pastel text at the top of the screen. Everything below follows from that:
# bigger, more saturated, and separated from the wallpaper.
#
# This file only overrides. Anything it does not mention still comes from
# theme.conf, so your own edits survive switching back and forth.
#
# Format is the same as theme.conf: KEY="value", read as data, never executed.

# --- Type -------------------------------------------------------------------
# The single biggest win, and free. Roughly a third larger across the board.
#
# Raising the bar means AeroSpace has to leave more room above the windows, and
# that number lives in ~/.aerospace.toml as a written-down `outer.top` rather
# than something computed at paint time. theme-control.sh resyncs it; editing
# this file by hand and only reloading SketchyBar leaves every window sitting
# under the taller bar.
SKETCHYBAR_BAR_HEIGHT="54"
SKETCHYBAR_ITEM_HEIGHT="36"
SKETCHYBAR_FONT_SIZE_ICON="18.0"
SKETCHYBAR_FONT_SIZE_LABEL="17.0"
SKETCHYBAR_FONT_SIZE_APP_ICON="21.0"
SKETCHYBAR_FONT_SIZE_BADGE="18.0"
SKETCHYBAR_FONT_SIZE_BADGE_ICON="17.0"
SKETCHYBAR_FONT_SIZE_POPUP="15.0"

# --- Shape ------------------------------------------------------------------
# Half the item height, so the pills are pills and nothing overshoots. Thicker
# borders because a 2px outline is the first thing video compression eats.
SKETCHYBAR_ITEM_CORNER_RADIUS="18"
SKETCHYBAR_PILL_CORNER_RADIUS="18"
SKETCHYBAR_BAR_CORNER_RADIUS="20"
SKETCHYBAR_BAR_BORDER_WIDTH="3"
SKETCHYBAR_ITEM_BORDER_WIDTH="3"
SKETCHYBAR_ITEM_PADDING="4"
SKETCHYBAR_BAR_PADDING="14"

# --- Depth ------------------------------------------------------------------
# A shadow is what stops the bar reading as part of the wallpaper once both are
# flattened into one video frame. Blur stays off: it costs a repaint on every
# event, and against a dark bar it buys almost nothing that the shadow has not
# already bought.
SKETCHYBAR_BAR_SHADOW="on"
SKETCHYBAR_ITEM_SHADOW="on"
SKETCHYBAR_BAR_BLUR="0"

# --- Neon accents -----------------------------------------------------------
# Literal colours rather than palette names. The palette in colors.sh is
# Catppuccin, which is designed to be easy to look at all day - the opposite of
# what survives a bitrate. These are the same hues pushed to full saturation and
# high luminance, which is what still reads as a colour after compression.
#
# 0xAARRGGBB. A role may be a palette name or a literal like these; both are
# read as data.
SKETCHYBAR_ACCENT_BAR_BORDER="0xff00e5ff"
SKETCHYBAR_ACCENT_CLOCK="0xffff2d95"
SKETCHYBAR_ACCENT_CALENDAR="0xff2979ff"
SKETCHYBAR_ACCENT_BATTERY="0xff00e5ff"
SKETCHYBAR_ACCENT_VOLUME="0xff39ff14"
SKETCHYBAR_ACCENT_FRONT_APP="0xffb026ff"
SKETCHYBAR_ACCENT_WORKSPACE_ACTIVE="0xff00e5ff"
SKETCHYBAR_ACCENT_WORKSPACE_ADD="0xffff8c00"
SKETCHYBAR_ACCENT_ATTENTION="0xffff2d95"
# The idle chips are the one thing that must not shout. Twelve of them sit next
# to the one that matters, and at this size a bright idle colour turns the left
# half of the bar into noise.
SKETCHYBAR_ACCENT_WORKSPACE_IDLE="0xff45475a"
SKETCHYBAR_ACCENT_MUTED="0xff6c7086"
SKETCHYBAR_ACCENT_ON_ACCENT="0xff11111b"
