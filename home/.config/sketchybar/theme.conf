# How the bar looks: fonts, sizes, geometry and which palette colour plays
# which role. This is the only file you have to edit to restyle SketchyBar.
#
# Changing the font used to mean editing six font strings across two files, and
# changing the bar height meant hand-aligning the same number in four files -
# one of which is Hammerspoon's recording layout and one of which is AeroSpace's
# top gap. Everything now reads the values below.
#
# To apply a change:
#
#     brew services restart sketchybar     # or: sketchybar --reload
#
# The deploy engine keeps your edits: once this file differs from the copy the
# last install wrote, `bootstrap/install/sketchybar.sh` reports "Kept local
# change" and leaves it alone. Run the installer with --force to take the
# shipped version back.
#
# Format rules, and they matter: one `KEY="value"` per line, no command
# substitution, no references to other variables. Hammerspoon and Python read
# this file with a line matcher rather than a shell, so anything cleverer than
# a literal value is invisible to them.

# --- Fonts ------------------------------------------------------------------
# The family needs Regular, Bold, Semibold, Heavy and Black variants;
# `bootstrap/install/sketchybar.sh` installs SF Pro and the app icon font.
# --- Preset -----------------------------------------------------------------
# A file in theme-presets/ whose values override the ones below, for the keys it
# declares. Empty means the values in this file are the whole answer.
#
#   stream   readable on a 1080p broadcast: bigger type, neon accents, depth
#
# Switch with `~/.config/sketchybar/theme-control.sh stream`, back with
# `theme-control.sh off`. Everything you change below still applies to whatever
# the preset does not mention, so this file stays yours either way.
SKETCHYBAR_THEME_PRESET=""

SKETCHYBAR_FONT_FAMILY="SF Pro"
SKETCHYBAR_FONT_APP="sketchybar-app-font"

SKETCHYBAR_FONT_SIZE_ICON="14.0"
SKETCHYBAR_FONT_SIZE_LABEL="13.0"
SKETCHYBAR_FONT_SIZE_APP_ICON="16.0"
SKETCHYBAR_FONT_SIZE_BADGE="14.0"
SKETCHYBAR_FONT_SIZE_BADGE_ICON="13.5"
SKETCHYBAR_FONT_SIZE_POPUP="12.0"

# --- Bar geometry -----------------------------------------------------------
SKETCHYBAR_BAR_HEIGHT="40"
SKETCHYBAR_BAR_Y_OFFSET="35"
SKETCHYBAR_BAR_MARGIN="20"
SKETCHYBAR_BAR_BORDER_WIDTH="2"
# Depth, off by default: the bar already floats 35px down the wallpaper, and a
# blur is a repaint on every event. The stream preset turns both on, where the
# bar has to separate itself from whatever is behind it on video.
SKETCHYBAR_BAR_SHADOW="off"
SKETCHYBAR_BAR_BLUR="0"
SKETCHYBAR_ITEM_SHADOW="off"
SKETCHYBAR_BAR_CORNER_RADIUS="15"
SKETCHYBAR_BAR_PADDING="10"
SKETCHYBAR_BAR_NOTCH_WIDTH="200"

# --- Item geometry ----------------------------------------------------------
SKETCHYBAR_ITEM_PADDING="3"
SKETCHYBAR_ITEM_HEIGHT="26"
SKETCHYBAR_ITEM_CORNER_RADIUS="15"
SKETCHYBAR_ITEM_BORDER_WIDTH="2"
# Right-hand clock / calendar / battery / volume pills. Same as the workspace
# chips on the left: two radii on one bar read as two designs, and at 26pt tall
# anything past 13 is already a full pill, so the larger number bought nothing
# but the mismatch.
SKETCHYBAR_PILL_CORNER_RADIUS="15"

# --- Reserved space above the windows ---------------------------------------
# A floating bar is not part of macOS's visible frame, so the window manager
# has to be told to leave room for it. Left empty this is derived as
# SKETCHYBAR_BAR_HEIGHT + SKETCHYBAR_BAR_Y_OFFSET + SKETCHYBAR_BAR_MARGIN, so
# raising the bar cannot leave a strip of windows hidden underneath it. Set it
# to a number to pin the reserved space instead.
#
# Read the resolved value with:
#     ~/.config/sketchybar/lib/theme.sh get THEME_TOP_INSET
#
# Consumers: AeroSpace's `outer.top` gap and Hammerspoon's Recording Mode.
SKETCHYBAR_BAR_TOP_INSET=""
# Used while the bar is hidden (Option+Shift+Space).
SKETCHYBAR_BAR_TOP_INSET_COMPACT="8"

# --- Colour roles -----------------------------------------------------------
# A value is either the name of a palette entry from colors.sh - BLACK, WHITE,
# RED, GREEN, BLUE, YELLOW, ORANGE, MAGENTA, GREY, CYAN, BG0, BG1, BG2 - or a
# literal 0xAARRGGBB. Names are resolved after colors.sh has been read, so
# switching palette there moves every role with it.
#
# To change the palette wholesale, edit colors.sh; to move one item onto a
# different colour, edit its line here.
SKETCHYBAR_ACCENT_BAR_BORDER="BLUE"
SKETCHYBAR_ACCENT_CLOCK="MAGENTA"
SKETCHYBAR_ACCENT_CALENDAR="BLUE"
SKETCHYBAR_ACCENT_BATTERY="CYAN"
SKETCHYBAR_ACCENT_VOLUME="GREEN"
SKETCHYBAR_ACCENT_FRONT_APP="BLUE"
SKETCHYBAR_ACCENT_WORKSPACE_ACTIVE="BLUE"
SKETCHYBAR_ACCENT_WORKSPACE_IDLE="GREY"
SKETCHYBAR_ACCENT_WORKSPACE_ADD="ORANGE"
SKETCHYBAR_ACCENT_ATTENTION="BLUE"
SKETCHYBAR_ACCENT_MUTED="GREY"
SKETCHYBAR_ACCENT_ON_ACCENT="WHITE"

# --- Workspace items --------------------------------------------------------
# Which workspaces get a chip on the bar. Left empty - the default - this comes
# from ~/.config/aerospace/, because that is where the workspaces themselves are
# defined and two lists of workspaces is how they end up disagreeing. Set it to
# a space separated list to override, or to pin a list on a machine that has
# SketchyBar but not this repo's AeroSpace config.
SKETCHYBAR_WORKSPACES=""
