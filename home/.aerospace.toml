    if.app-name-regex-substring = '^Camtasia$'
    run = ['layout floating', 'move-node-to-workspace 13']

[[on-window-detected]]
    if.app-name-regex-substring = '^Snagit$'
    run = ['layout floating', 'move-node-to-workspace 13']


